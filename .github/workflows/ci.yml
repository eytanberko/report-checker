name: CI

# Lint, type-check and test on every push. Fully offline: tests never call an LLM (conftest removes API
# keys, answers come from .llm_cache/), so no secrets are needed. The Edge browser check skips itself here.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LLM_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests
        run: pytest -q --cov=checker --cov=evaluate --cov=scripts --cov-report=term
