[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["checker", "scripts", "evaluate.py", "app.py"]
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
